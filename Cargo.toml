[package]
name = "SharkDB"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[lib]
name = "sharkdb"

[features]
default = []
# Optional gRPC server and client. Off by default so the core engine keeps its
# five-crate dependency footprint.
grpc = [
    "dep:tonic",
    "dep:prost",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic-build",
    "dep:protoc-bin-vendored",
]

[dependencies]
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.15"
fs4 = "0.8.4"
tempfile = "3.12.0"

tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
], optional = true }
tokio-stream = { version = "0.1", optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[[bench]]
name = "bench"
harness = false

[[bin]]
name = "sharkdb-server"
path = "src/bin/server.rs"
required-features = ["grpc"]

[[example]]
name = "grpc_client"
path = "examples/grpc_client.rs"
required-features = ["grpc"]
